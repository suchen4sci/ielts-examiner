const parts=document.querySelectorAll('[data-part]');
const label=document.querySelector('#status'), clock=document.querySelector('#clock'), cancel=document.querySelector('#cancel');
let session=null;
function closeRound(s,message){
 if(session!==s)return;
 session=null;
 cancel.disabled=true;
 for(const b of parts)b.disabled=false;
 clearInterval(s.display);
 s.stream?.getTracks().forEach(t=>t.stop());
 s.ctx.close().catch(()=>{});
 clock.textContent='—'; label.textContent=message;
}
function cue(s,name,at,done){
 const src=s.ctx.createBufferSource();
 src.buffer=s.audio[name]; src.connect(s.ctx.destination);
 src.onended=()=>{if(session===s)done()};
 src.start(at);
 return at+src.buffer.duration;
}
function listen(s){
 s.phase='waiting'; s.until=0; label.textContent='等待开口'; clock.textContent='—';
 s.detector.port.postMessage('arm');
}
function startAnswer(s,onset){
 if(session!==s || s.phase!=='waiting')return;
 s.phase='answer'; s.until=onset+({1:30,2:120,3:60})[s.part];
 label.textContent='回答计时中';
 cue(s,'stop',s.until,()=>closeRound(s,'本题时间到'));
}
async function start(part){
 if(session)return;
 const ctx=new AudioContext();
 const s=session={ctx,part,audio:{},phase:'setup'};
 cancel.disabled=false; for(const b of parts)b.disabled=true;
 label.textContent='正在启用麦克风';
 try{
  await ctx.resume();
  if(session!==s)return;
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  if(session!==s){stream.getTracks().forEach(t=>t.stop());return}
  s.stream=stream;
  for(const [name,encoded] of Object.entries(cues)){
   const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
   s.audio[name]=await ctx.decodeAudioData(bytes.buffer);
  }
  const code=`class Onset extends AudioWorkletProcessor {
   constructor(){super();this.armed=false;this.samples=0;this.port.onmessage=()=>{this.armed=true;this.samples=0}}
   process(inputs){const data=inputs[0][0];if(this.armed&&data){
    let energy=0;for(const x of data)energy+=x*x;
    this.samples=energy/data.length>0.00015?this.samples+data.length:0;
    if(this.samples>=0.08*sampleRate){this.armed=false;this.port.postMessage(currentTime-(this.samples-data.length)/sampleRate)}
   }return true}
  } registerProcessor('voice-onset',Onset);`;
  await ctx.audioWorklet.addModule('data:text/javascript;charset=utf-8,'+encodeURIComponent(code));
  if(session!==s)return;
  s.detector=new AudioWorkletNode(ctx,'voice-onset');
  ctx.createMediaStreamSource(stream).connect(s.detector);
  s.detector.connect(ctx.destination); // processor outputs silence
  s.detector.port.onmessage=e=>startAnswer(s,e.data);
  stream.getAudioTracks()[0].onended=()=>closeRound(s,'麦克风已断开，请重新选择本题');
  s.display=setInterval(()=>{
   if(s.until)clock.textContent=Math.max(0,Math.ceil(s.until-ctx.currentTime))+' s';
  },100);
  if(part===2){
   s.phase='prep'; s.until=ctx.currentTime+60; label.textContent='准备中';
   cue(s,'begin',s.until,()=>listen(s));
  }else listen(s);
 }catch(e){closeRound(s,'无法启动计时：'+e.message)}
}
for(const b of parts)b.onclick=()=>start(Number(b.dataset.part));
cancel.onclick=()=>{if(session)closeRound(session,'已取消本题')};
